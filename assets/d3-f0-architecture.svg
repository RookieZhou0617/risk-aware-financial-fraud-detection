<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="820" viewBox="0 0 1760 820" role="img" aria-labelledby="title desc">
  <title id="title">Frozen D3 plus F0 architecture for financial statement fraud detection</title>
  <desc id="desc">Four-stage architecture showing multi-source inputs, D3 intrinsic risk anchor construction, F0 heterogeneous graph residual evidence, and anchor-preserving fusion with final prediction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="greenHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="orangeHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="purpleHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#0f172a; }
      .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#475569; }
      .label { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#172033; }
      .body { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#334155; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif; fill:#64748b; }
      .mono { font: 600 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#172033; }
      .panel { fill:#ffffff; stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; rx:20; }
      .card { stroke-width:1.4; rx:14; filter:url(#shadow); }
      .flow { fill:none; stroke:#475569; stroke-width:1.7; marker-end:url(#arrowDark); }
      .stageFlow { fill:none; stroke:#3b82f6; stroke-width:5; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1760" height="820" fill="url(#bg)"/>

  <!-- Stage panels -->
  <rect class="panel" x="20" y="20" width="410" height="780"/>
  <rect class="panel" x="450" y="20" width="410" height="780"/>
  <rect class="panel" x="880" y="20" width="410" height="780"/>
  <rect class="panel" x="1310" y="20" width="430" height="780"/>

  <rect x="30" y="30" width="390" height="84" rx="14" fill="url(#blueHead)"/>
  <rect x="460" y="30" width="390" height="84" rx="14" fill="url(#greenHead)"/>
  <rect x="890" y="30" width="390" height="84" rx="14" fill="url(#orangeHead)"/>
  <rect x="1320" y="30" width="410" height="84" rx="14" fill="url(#purpleHead)"/>

  <text class="title" x="225" y="67" text-anchor="middle">1. Multi-source Inputs</text>
  <text class="subtitle" x="225" y="94" text-anchor="middle">多源时点输入</text>
  <text class="title" x="655" y="67" text-anchor="middle">2. D3 Risk Anchor</text>
  <text class="subtitle" x="655" y="94" text-anchor="middle">冻结内生风险锚点</text>
  <text class="title" x="1085" y="67" text-anchor="middle">3. F0 Graph Evidence</text>
  <text class="subtitle" x="1085" y="94" text-anchor="middle">保守关系增量证据</text>
  <text class="title" x="1525" y="67" text-anchor="middle">4. Fusion &amp; Output</text>
  <text class="subtitle" x="1525" y="94" text-anchor="middle">锚点保持与预测</text>

  <!-- Stage 1 -->
  <rect class="card" x="45" y="145" width="360" height="105" fill="#eff6ff" stroke="#60a5fa"/>
  <circle cx="80" cy="180" r="18" fill="#3b82f6"/>
  <text x="80" y="187" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">A</text>
  <text class="label" x="112" y="180">Financial signals</text>
  <text class="body" x="112" y="211">ratios · content · base risk</text>
  <text class="small" x="112" y="235">strict fold-specific preprocessing</text>

  <rect class="card" x="45" y="270" width="360" height="105" fill="#f0fdf4" stroke="#4ade80"/>
  <circle cx="80" cy="305" r="18" fill="#22c55e"/>
  <text x="80" y="312" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">B</text>
  <text class="label" x="112" y="305">Self-history</text>
  <text class="body" x="112" y="336">strictly prior company states</text>
  <text class="small" x="112" y="360">history availability kept explicit</text>

  <rect class="card" x="45" y="395" width="360" height="105" fill="#fff7ed" stroke="#fb923c"/>
  <circle cx="80" cy="430" r="18" fill="#f97316"/>
  <text x="80" y="437" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">C</text>
  <text class="label" x="112" y="430">Point-in-time risk</text>
  <text class="body" x="112" y="461">cross-fitted historical scores</text>
  <text class="small" x="112" y="485">no target-year label access</text>

  <rect class="card" x="45" y="520" width="360" height="105" fill="#f5f3ff" stroke="#a78bfa"/>
  <circle cx="80" cy="555" r="18" fill="#8b5cf6"/>
  <text x="80" y="562" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">D</text>
  <text class="label" x="112" y="555">MD&amp;A text</text>
  <text class="body" x="112" y="586">frozen text representation</text>
  <text class="small" x="112" y="610">missingness represented explicitly</text>

  <rect x="65" y="666" width="320" height="78" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="225" y="697" text-anchor="middle">Four source tokens</text>
  <rect x="76" y="708" width="68" height="25" rx="7" fill="#dbeafe"/>
  <rect x="153" y="708" width="68" height="25" rx="7" fill="#dcfce7"/>
  <rect x="230" y="708" width="68" height="25" rx="7" fill="#ffedd5"/>
  <rect x="307" y="708" width="68" height="25" rx="7" fill="#ede9fe"/>
  <text x="110" y="726" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#334155">t_base</text>
  <text x="187" y="726" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#334155">t_fin</text>
  <text x="264" y="726" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#334155">t_hist</text>
  <text x="341" y="726" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#334155">t_text</text>

  <!-- Stage 2 -->
  <rect class="card" x="480" y="145" width="350" height="74" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="655" y="176" text-anchor="middle">Source-wise projection</text>
  <text class="body" x="655" y="203" text-anchor="middle">aligned hidden tokens</text>
  <path class="flow" d="M655 219 L655 246"/>

  <rect class="card" x="480" y="250" width="165" height="92" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="562" y="282" text-anchor="middle">Current state</text>
  <text class="mono" x="562" y="317" text-anchor="middle">h_t</text>
  <rect class="card" x="665" y="250" width="165" height="92" fill="#f0fdf4" stroke="#4ade80"/>
  <text class="label" x="747" y="282" text-anchor="middle">History state</text>
  <text class="mono" x="747" y="317" text-anchor="middle">h_hist</text>
  <path class="flow" d="M562 342 L610 377"/>
  <path class="flow" d="M747 342 L700 377"/>

  <rect class="card" x="480" y="380" width="350" height="142" fill="#ffffff" stroke="#60a5fa"/>
  <text class="label" x="655" y="416" text-anchor="middle">Current–history deviation</text>
  <text class="body" x="505" y="451">signed difference</text>
  <text class="body" x="505" y="481">absolute difference</text>
  <text class="body" x="675" y="451">interaction</text>
  <text class="body" x="675" y="481">cosine similarity</text>
  <path class="flow" d="M655 522 L655 549"/>

  <rect class="card" x="500" y="552" width="310" height="75" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="655" y="583" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#172033">Deviation MLP + source attention</text>
  <text class="small" x="655" y="610" text-anchor="middle">current and historical evidence fused</text>
  <path class="flow" d="M655 627 L655 654"/>

  <rect class="card" x="500" y="657" width="310" height="88" fill="#ecfdf5" stroke="#16a34a"/>
  <text class="label" x="655" y="690" text-anchor="middle">Frozen D3 intrinsic anchor</text>
  <text class="mono" x="655" y="724" text-anchor="middle">h₀ · z₀ · p₀</text>

  <!-- Stage 3: graph illustration -->
  <rect x="905" y="138" width="360" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="1085" y="167" text-anchor="middle">Heterogeneous peer graph</text>
  <g stroke="#64748b" stroke-width="2" opacity="0.75">
    <line x1="950" y1="225" x2="1005" y2="190"/><line x1="950" y1="225" x2="1010" y2="265"/>
    <line x1="1005" y1="190" x2="1060" y2="220"/><line x1="1010" y1="265" x2="1060" y2="220"/>
    <line x1="1060" y1="220" x2="1115" y2="185"/><line x1="1060" y1="220" x2="1120" y2="270"/>
    <line x1="1115" y1="185" x2="1170" y2="225"/><line x1="1120" y1="270" x2="1170" y2="225"/>
    <line x1="1010" y1="265" x2="1120" y2="270"/>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <circle cx="950" cy="225" r="14" fill="#fb923c"/><circle cx="1005" cy="190" r="14" fill="#4ade80"/>
    <circle cx="1010" cy="265" r="14" fill="#93c5fd"/><circle cx="1060" cy="220" r="17" fill="#3b82f6"/>
    <circle cx="1115" cy="185" r="14" fill="#a78bfa"/><circle cx="1120" cy="270" r="14" fill="#94a3b8"/>
    <circle cx="1170" cy="225" r="14" fill="#4ade80"/>
  </g>
  <text class="small" x="1197" y="193">auditor</text>
  <text class="small" x="1197" y="218">shareholder</text>
  <text class="small" x="1197" y="243">people</text>
  <text class="small" x="1197" y="268">organizations</text>
  <text class="small" x="1197" y="293">other firms</text>

  <path class="flow" d="M1085 328 L1085 351"/>
  <rect class="card" x="915" y="354" width="340" height="62" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="1085" y="381" text-anchor="middle">Stable top-half peer selection</text>
  <text class="small" x="1085" y="403" text-anchor="middle">frozen-anchor cosine · deterministic ties</text>
  <path class="flow" d="M1085 416 L1085 439"/>

  <rect class="card" x="915" y="442" width="340" height="62" fill="#f0fdf4" stroke="#4ade80"/>
  <text class="label" x="1085" y="469" text-anchor="middle">Risk-aware relation messages</text>
  <text class="small" x="1085" y="491" text-anchor="middle">peer state · anchor difference · risk gap</text>
  <path class="flow" d="M1085 504 L1085 527"/>

  <rect class="card" x="915" y="530" width="340" height="62" fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="1085" y="557" text-anchor="middle">Relation reliability gate</text>
  <text class="small" x="1085" y="579" text-anchor="middle">label-free context statistics</text>
  <path class="flow" d="M1085 592 L1085 615"/>

  <rect class="card" x="915" y="618" width="340" height="62" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="label" x="1085" y="645" text-anchor="middle">Cross-relation attention + NULL</text>
  <text class="small" x="1085" y="667" text-anchor="middle">explicit option to abstain</text>
  <path class="flow" d="M1085 680 L1085 703"/>

  <rect class="card" x="935" y="706" width="300" height="52" fill="#fff7ed" stroke="#f97316"/>
  <text class="label" x="1085" y="739" text-anchor="middle">Zero-init residual  Δh_graph</text>

  <!-- Stage 4 -->
  <rect class="card" x="1345" y="150" width="360" height="102" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="1525" y="184" text-anchor="middle">Anchor-preserving fusion</text>
  <text class="mono" x="1525" y="224" text-anchor="middle">h_final = h₀ + Δh_graph</text>
  <path class="flow" d="M1525 252 L1525 284"/>

  <rect class="card" x="1345" y="287" width="360" height="94" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="label" x="1525" y="322" text-anchor="middle">Frozen D3 classifier</text>
  <text class="body" x="1525" y="353" text-anchor="middle">graph branch learns only the residual</text>
  <path class="flow" d="M1525 381 L1525 413"/>

  <rect class="card" x="1345" y="416" width="360" height="112" fill="#fff1f2" stroke="#fb7185"/>
  <text class="label" x="1525" y="453" text-anchor="middle">Fraud probability</text>
  <text class="mono" x="1525" y="490" text-anchor="middle">ŷ = σ(z_final) ∈ [0, 1]</text>
  <text class="small" x="1525" y="516" text-anchor="middle">financial statement fraud risk</text>

  <rect x="1345" y="568" width="360" height="164" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text class="label" x="1370" y="601">Final evidence boundary</text>
  <circle cx="1380" cy="638" r="16" fill="#3b82f6"/>
  <text x="1380" y="645" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">1</text>
  <text class="body" x="1410" y="644">2022 OOT: 5/5 seed deltas positive</text>
  <circle cx="1380" cy="681" r="16" fill="#f59e0b"/>
  <text x="1380" y="688" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#fff">2</text>
  <text class="body" x="1410" y="687">95% intervals cross zero</text>
  <text class="small" x="1370" y="716">Directional evidence; no significance claim.</text>

  <!-- Cross-stage arrows -->
  <path class="stageFlow" d="M430 410 L448 410"/>
  <path class="stageFlow" d="M860 410 L878 410"/>
  <path class="stageFlow" d="M1290 410 L1308 410"/>
</svg>
